[project]
name = "geotech-rl"
version = "0.1.1"
description = "Procedural RL environments for geotechnical engineering judgement."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arthur Cunha da Silva" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.15"]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2.2", "matplotlib>=3.9"]

[project.scripts]
geotech-rl = "geotech_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotech_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
