[project]
name = "geotech-poles"
version = "0.1.0"
description = "Verifiers taskset: lateral capacity of pole foundations from site records."
requires-python = ">=3.12"
dependencies = ["verifiers", "geotech-rl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geotech_poles"]
